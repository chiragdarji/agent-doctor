name: agent-doctor
description: Semantic health check for AI agent instruction files (CLAUDE.md, AGENTS.md, Cursor rules, etc.)
author: chiragdarji

branding:
  icon: activity
  color: blue

inputs:
  files:
    description: >
      Space-separated list of instruction files to analyse.
      Defaults to auto-discovery (--all) when not specified.
    required: false
    default: ''
  fail-on:
    description: 'Severity threshold that causes a non-zero exit: critical | warning | suggestion'
    required: false
    default: 'critical'
  structural-only:
    description: 'Skip the semantic (LLM) layer — no API key required'
    required: false
    default: 'false'
  model:
    description: 'Override LLM model (e.g. gpt-4o, claude-sonnet-4-6)'
    required: false
    default: ''
  anthropic-api-key:
    description: 'Anthropic API key for Claude models. Falls back to ANTHROPIC_API_KEY env var.'
    required: false
    default: ''
  openai-api-key:
    description: 'OpenAI API key for gpt-*/o-series models. Falls back to OPENAI_API_KEY env var.'
    required: false
    default: ''
  format:
    description: 'Output format: text | json'
    required: false
    default: 'text'

outputs:
  score:
    description: 'Health score (0–100) of the first analysed file'
  grade:
    description: 'Letter grade (A–F) of the first analysed file'
  issues-count:
    description: 'Total number of issues found across all analysed files'
  readiness-score:
    description: 'Agent readiness score (0–100) of the first analysed file'

runs:
  using: node20
  main: action-runner.js
