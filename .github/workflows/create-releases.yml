name: Create Version Releases

on:
  workflow_dispatch:

jobs:
  create-releases:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create v1.0.0 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0.0 \
            --target 3dcdbc3 \
            --title "v1.0.0 — Agent Readiness rules, auto-fix expansion, JSON Schema" \
            --notes "## What's new in v1.0.0

**5 new structural rules** (zero API cost):

| Rule | Severity | What it catches |
|------|----------|----------------|
| \`sensitive-data\` | critical | API keys, Bearer tokens, private key blocks, AWS/GitHub credentials hardcoded in instruction files |
| \`missing-agent-persona\` | warning | Instruction files with no role/identity statement |
| \`redundant-instructions\` | warning | Same directive repeated 3+ times (fuzzy deduplication) |
| \`missing-examples\` | suggestion | Complex multi-condition sections with no code block or inline example |
| \`instruction-ordering\` | suggestion | Security/constraint headings buried after task sections |

**Auto-fix expansion** — 3 new \`--fix\` targets: \`sensitive-data\`, \`missing-agent-persona\`, \`hardcoded-environment\`

**VS Code extension v0.2.0** — Quick Fix support for 3 new rules.

**\`.agentdoctor.json\` JSON Schema** for IDE validation and autocomplete." || echo "v1.0.0 may already exist, skipping"

      - name: Create v1.1.0 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.1.0 \
            --target 38ca070 \
            --title "v1.1.0 — Rule precision, badge format, extended secret detection" \
            --notes "## What's new in v1.1.0

- **\`todo-in-instructions\` severity** downgraded critical → warning
- **False-positive reduction** — markers inside code blocks, table rows, and inline code are now skipped
- **\`sensitive-data\` expanded patterns** — Slack, Google API, Stripe live keys, GitHub fine-grained PATs
- **\`sensitive-data\` context masking** — context field shows masked value, not the raw secret
- **\`--format badge\`** — emits a shields.io endpoint JSON blob for README status badges" || echo "v1.1.0 may already exist, skipping"

      - name: Create v1.2.0 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.2.0 \
            --target ae07057 \
            --title "v1.2.0 — prompt-injection rule + SARIF output" \
            --notes "## What's new in v1.2.0

- **\`prompt-injection\` structural rule** (critical) — detects prompt injection attempts: override openers and blanket delegation. Skips code blocks, table rows, and inline code spans.
- **\`--format sarif\`** — emits SARIF 2.1.0 JSON for upload to GitHub Code Scanning" || echo "v1.2.0 may already exist, skipping"

      - name: Create v1.3.0 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.3.0 \
            --target 03b6feb \
            --title "v1.3.0 — --init-workflow generates GitHub Actions CI" \
            --notes "## What's new in v1.3.0

- **\`--init-workflow\`** — generates .github/workflows/agent-doctor.yml for CI. Two variants: basic (run + fail) and sarif (+ upload to GitHub Code Scanning / Security tab)." || echo "v1.3.0 may already exist, skipping"

      - name: Create v1.4.0 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.4.0 \
            --target 9525b14 \
            --title "v1.4.0 — AGENTS.md health rules + pre-commit hook installer" \
            --notes "## What's new in v1.4.0

- **\`missing-handoff-protocol\`** (warning, AGENTS.md only) — flags AGENTS.md files with no escalation or handoff language
- **\`missing-agent-scope\`** (warning, AGENTS.md only) — flags AGENTS.md files with no scope definition
- **\`--init-pre-commit\`** — installs a pre-commit hook (native .git/hooks or pre-commit framework variant)" || echo "v1.4.0 may already exist, skipping"

      - name: Create v1.5.0 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.5.0 \
            --target f8d4a60 \
            --title "v1.5.0 — broken-section-reference rule + HTML reports" \
            --notes "## What's new in v1.5.0

- **\`broken-section-reference\`** (warning) — detects 'see the X section' cross-references where heading X does not exist in the same file. Fuzzy case-insensitive match.
- **\`--format html\`** — generates a self-contained HTML health report with score/grade tiles, collapsible issue list, readiness dimension bars, dark mode, and no external dependencies.

519 tests, all pass." || echo "v1.5.0 may already exist, skipping"
